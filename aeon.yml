# AUTONOMOPOLY — aeon skill configuration
#
# Skills run via GitHub Actions (messages.yml dispatches on schedule).
# Identity reads from identity/SOUL.md and identity/STYLE.md.
# Memory persists in memory/.

# Lean schedule (2026-06-10, operator decision): ~30 LLM runs/day, down from ~60.
# tick absorbed lp-monitor (same chain reads, one run instead of two); stake-diem +
# track-earnings run as deterministic scripts (no LLM step — see script_only in
# .github/workflows/aeon.yml).
skills:
  # Agent tick — claim fees, LP DIEM, LP range check + reposition queue (absorbed
  # lp-monitor 2026-06-10), maintenance inference
  tick: { enabled: true, schedule: "0 * * * *" }   # hourly — pool moved ~940 ticks in a day this week; range checks earn their keep

  # Proactive health check: skill failures, LP state, memory flags
  heartbeat: { enabled: true, schedule: "0 8,20 * * *" }   # 2× daily

  # Disabled 2026-06-10: duties absorbed into tick (one job per 2h covers both).
  # Keep for manual dispatch (gh workflow run aeon.yml -f skill=lp-monitor).
  lp-monitor: { enabled: false, schedule: "0 * * * *" }

  # On-chain monitoring of agent wallet and FeeLocker
  on-chain-monitor: { enabled: true, schedule: "0 6 * * *", model: "claude-sonnet-4-6" }

  # Claim DIEM from FeeLocker, run accumulate-vs-build analysis, route earnings
  claim-diem: { enabled: true, schedule: "0 */12 * * *", model: "claude-sonnet-4-6" }  # every 12h UTC

  # Track LP earnings per position per day — writes to memory/earnings.jsonl
  # script_only: runs scripts/track-earnings.ts directly, no LLM
  track-earnings: { enabled: true, schedule: "55 23 * * *", model: "claude-sonnet-4-6" }  # end of day UTC

  # Weekly goal audit — recompute milestone ETAs, self-funding ratio, mode
  # consistency; report to creator. The follow-up loop for memory/goals.json.
  goal-review: { enabled: true, schedule: "0 8 * * 1", model: "claude-sonnet-4-6" }  # Monday 08:00 UTC

  # Safety net for Venice inference credits: if sDIEM < target, queue a stake-diem
  # intent for the gated executor (stakes liquid wallet DIEM only).
  # script_only: runs scripts/stake-diem-check.ts directly, no LLM
  stake-diem: { enabled: true, schedule: "30 */12 * * *", model: "claude-sonnet-4-6" }
  # Floor for the sDIEM safety net; claim-and-allocate targets 1.5× trailing
  # 7d inference cost (memory/inference-cost.md), falling back to this:
  stake_min_diem: 5

  # Aggregate token-usage.csv → memory/inference-cost.md for self-optimization
  cost-report: { enabled: true, schedule: "0 20 * * 0", model: "claude-sonnet-4-6" }  # Sunday 20:00 UTC

  # Twitter/X content lifecycle — ALL PAUSED 2026-06-10 (operator decision):
  # posting paused for quality review (goals.json tweetingPaused) and reads are
  # blocked (X READ access). Re-enable together when the self-funding ratio ≥ 1
  # and X credits are funded — X moved to pay-per-use (owned reads $0.001), so a
  # low-cadence listen (e.g. "0 */6 * * *") costs cents/month when it returns.
  tweet-engage:    { enabled: false, schedule: "0 6 * * *",    model: "claude-opus-4-8" }
  tweet-broadcast: { enabled: false, schedule: "0 14 * * *",   model: "claude-opus-4-8" }
  tweet-listen:    { enabled: false, schedule: "*/5 * * * *",  model: "claude-opus-4-8" }
  tweet-reflect:   { enabled: false, schedule: "0 20 * * 0",   model: "claude-opus-4-8" }
  tweet-promote:   { enabled: false, schedule: "0 10 * * 2,5", model: "claude-opus-4-8" }

  # self-improve runs daily 10:00 UTC via the cron in .github/workflows/aeon.yml
  # (gated on goals.json mode == "build" there). NOT listed as an entry here on
  # purpose — a skills entry would make the messages.yml scheduler dispatch it a
  # second time on the same schedule.

  # Launch a VVV-denominated token from memory/launch-queue.jsonl
  launch-vvv-token: { enabled: false, schedule: "0 10 * * *", model: "claude-sonnet-4-6" }

  # Stake accumulated VVV fees on Venice staking contract for sVVV (inference gate)
  stake-vvv: { enabled: false, schedule: "0 9 * * 1", model: "claude-sonnet-4-6" }   # weekly Monday

  # Bootstrap Venice compute via two-tranche presale (VVV irrevocable + DIEM time-lock)
  compute-presale: { enabled: false, schedule: "0 11 * * *", model: "claude-sonnet-4-6" }

  # Disabled — re-enable when in build mode
  token-report: { enabled: false, schedule: "30 12 * * *", model: "claude-sonnet-4-6" }
  price-threshold-alert: { enabled: false, schedule: "*/30 * * * *", model: "claude-sonnet-4-6" }

# Default model for skills without a per-skill override
model: claude-sonnet-4-6

# AI Gateway — route Claude Code inference
# provider options:
#   venice  — staked DIEM pays for inference (default; requires VENICE_API_KEY secret)
#   surplus — Surplus Intelligence marketplace (requires SURPLUS_API_KEY secret)
#   direct  — Anthropic API directly (requires ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN)
#
# fallback — used automatically when primary provider's key is absent or depleted.
# Set to "direct" to fall back to CLAUDE_CODE_OAUTH_TOKEN without manual aeon.yml edits.
gateway:
  provider: venice    # primary: sDIEM-gated inference
  fallback: direct    # automatic fallback: CLAUDE_CODE_OAUTH_TOKEN when Venice key absent

# Reactive triggers — auto-repair on consecutive failures
reactive:
  # refresh-venice-key now runs as a dedicated non-LLM pre-step every tick
  # (see .github/workflows/aeon.yml "Refresh Venice key") — idempotent, and keeps
  # the Privy mint + `gh secret set` org token out of the LLM step.
  # refresh-venice-key:
  #   trigger:
  #     - { on: tick,       when: "consecutive_failures >= 3" }
  #     - { on: claim-diem, when: "consecutive_failures >= 3" }
  # heartbeat:
  #   trigger:
  #     - { on: tick, when: "consecutive_failures >= 3" }

# Chains — multi-step pipelines (unused in accumulate mode)
chains: {}

# Output channels
channels:
  jsonrender:
    enabled: false

# Telegram notification (set TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID in repo secrets)
telegram:
  enabled: true
